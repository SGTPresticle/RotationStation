<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RotationStation v1.5.0</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-purple-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function RotationStationApp() {
      // App State
      const [currentTab, setCurrentTab] = useState('schedule'); // 'schedule' | 'analytics' | 'management' | 'settings'
      const [managementSubTab, setManagementSubTab] = useState('users'); // 'users' | 'employees' | 'benches'
      const [darkMode, setDarkMode] = useState(true);
      const [showNotesModal, setShowNotesModal] = useState(false);

      // Data States
      const [users, setUsers] = useState([
        { username: 'admin', role: 'admin', passwordSet: true },
        { username: 'supervisor1', role: 'supervisor', passwordSet: true },
        { username: 'observer_joe', role: 'observer', passwordSet: false }
      ]);

      const [employees, setEmployees] = useState([
        { id: '1', name: 'Alice Smith', clockNum: '101', shift: '1' },
        { id: '2', name: 'Bob Jones', clockNum: '102', shift: '1' },
        { id: '3', name: 'Charlie Brown', clockNum: '105', shift: '2' },
        { id: '4', name: 'Diana Prince', clockNum: '110', shift: '2' }
      ]);

      const [benches, setBenches] = useState([
        { id: 'b1', name: 'Line A (Assembly)' },
        { id: 'b2', name: 'Line B (Testing)' },
        { id: 'b3', name: 'Packaging Station' },
        { id: 'b4', name: 'Quality Control' }
      ]);

      // Form inputs
      const [newUsername, setNewUsername] = useState('');
      const [newUserRole, setNewUserRole] = useState('supervisor');
      const [newEmpName, setNewEmpName] = useState('');
      const [newEmpClock, setNewEmpClock] = useState('');
      const [newEmpShift, setNewEmpShift] = useState('1');
      const [newBenchName, setNewBenchName] = useState('');

      const handleAddUser = (e) => {
        e.preventDefault();
        if (!newUsername.trim()) return;
        setUsers([...users, { username: newUsername.trim(), role: newUserRole, passwordSet: false }]);
        setNewUsername('');
      };

      const handleAddEmployee = (e) => {
        e.preventDefault();
        if (!newEmpName.trim()) return;
        setEmployees([...employees, { id: Date.now().toString(), name: newEmpName.trim(), clockNum: newEmpClock.trim(), shift: newEmpShift }]);
        setNewEmpName('');
        setNewEmpClock('');
      };

      const handleAddBench = (e) => {
        e.preventDefault();
        if (!newBenchName.trim()) return;
        setBenches([...benches, { id: Date.now().toString(), name: newBenchName.trim() }]);
        setNewBenchName('');
      };

      return (
        <div className="max-w-4xl mx-auto p-3 sm:p-6 min-h-screen flex flex-col justify-between">
          <div className="space-y-4">
            
            {/* Global Header (Two-row structure with Notes button pinned beside username badge) */}
            <header className="pb-3 border-b border-slate-800 space-y-3">
              <div className="flex justify-between items-center">
                <h1 className="text-lg sm:text-xl font-black tracking-tight bg-gradient-to-r from-purple-400 to-blue-400 bg-clip-text text-transparent">
                  RotationStation <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-normal">v1.5.0</span>
                </h1>
                
                {/* User Badge + Shift Notes Button Pinned Together */}
                <div className="flex items-center gap-2">
                  <div className="px-2.5 py-1 rounded-lg bg-slate-800/80 border border-slate-700/60 text-xs font-bold text-slate-200 flex items-center gap-1.5 shadow-sm">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    admin
                  </div>
                  <button 
                    onClick={() => setShowNotesModal(true)}
                    className="px-2.5 py-1 rounded-lg bg-purple-600/20 hover:bg-purple-600/30 border border-purple-500/30 text-purple-300 text-xs font-bold transition flex items-center gap-1"
                    title="Shift Notes"
                  >
                    📝 Notes
                  </button>
                </div>
              </div>

              {/* Navigation Tabs (Compact 4-column 2-row layout with strict bounds to prevent overflow) */}
              <div className="grid grid-cols-4 gap-1.5">
                <button 
                  onClick={() => setCurrentTab('schedule')} 
                  className={`py-2 px-1 rounded-xl text-xs font-bold text-center transition truncate ${currentTab === 'schedule' ? 'bg-purple-600 text-white shadow-md shadow-purple-900/30' : 'bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700/50'}`}
                >
                  Schedule
                </button>
                <button 
                  onClick={() => setCurrentTab('analytics')} 
                  className={`py-2 px-1 rounded-xl text-xs font-bold text-center transition truncate ${currentTab === 'analytics' ? 'bg-purple-600 text-white shadow-md shadow-purple-900/30' : 'bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700/50'}`}
                >
                  Analytics
                </button>
                <button 
                  onClick={() => setCurrentTab('management')} 
                  className={`py-2 px-1 rounded-xl text-xs font-bold text-center transition truncate ${currentTab === 'management' ? 'bg-purple-600 text-white shadow-md shadow-purple-900/30' : 'bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700/50'}`}
                >
                  Management
                </button>
                <button 
                  onClick={() => setCurrentTab('settings')} 
                  className={`py-2 px-1 rounded-xl text-xs font-bold text-center transition truncate ${currentTab === 'settings' ? 'bg-purple-600 text-white shadow-md shadow-purple-900/30' : 'bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700/50'}`}
                >
                  Settings
                </button>
              </div>
            </header>

            {/* Main Content Area */}
            <main className="pt-2">
              {currentTab === 'schedule' && (
                <div className="p-6 rounded-2xl bg-slate-900/50 border border-slate-800 text-center space-y-3">
                  <h2 className="text-base font-bold text-slate-200">Shift Schedule Board</h2>
                  <p className="text-xs text-slate-400">Seniority-sorted operator rotation tracking across workstations.</p>
                </div>
              )}

              {currentTab === 'analytics' && (
                <div className="p-6 rounded-2xl bg-slate-900/50 border border-slate-800 text-center space-y-3">
                  <h2 className="text-base font-bold text-slate-200">Supervisor Analytics</h2>
                  <p className="text-xs text-slate-400">Shift statistics, exceptions, and workstation utilization metrics.</p>
                </div>
              )}

              {currentTab === 'management' && (
                <div className="rounded-2xl bg-slate-900/50 border border-slate-800 p-4 sm:p-5 space-y-4">
                  <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                    <h2 className="text-base font-bold text-slate-200">Management Center</h2>
                    <span className="text-[10px] text-slate-400">Powder Coat Line • 143 Racks</span>
                  </div>

                  {/* Horizontal Non-Scrolling Management Sub-Tabs */}
                  <div className="grid grid-cols-3 gap-2 pb-3 border-b border-slate-800/60">
                    <button 
                      onClick={() => setManagementSubTab('users')} 
                      className={`py-2 px-2 rounded-xl text-xs sm:text-sm font-bold text-center transition ${managementSubTab === 'users' ? 'bg-purple-600 text-white shadow-sm' : 'bg-slate-800 text-slate-300 hover:bg-slate-800/80 border border-slate-700/50'}`}
                    >
                      🔐 Users
                    </button>
                    <button 
                      onClick={() => setManagementSubTab('employees')} 
                      className={`py-2 px-2 rounded-xl text-xs sm:text-sm font-bold text-center transition ${managementSubTab === 'employees' ? 'bg-purple-600 text-white shadow-sm' : 'bg-slate-800 text-slate-300 hover:bg-slate-800/80 border border-slate-700/50'}`}
                    >
                      👥 Employees
                    </button>
                    <button 
                      onClick={() => setManagementSubTab('benches')} 
                      className={`py-2 px-2 rounded-xl text-xs sm:text-sm font-bold text-center transition ${managementSubTab === 'benches' ? 'bg-purple-600 text-white shadow-sm' : 'bg-slate-800 text-slate-300 hover:bg-slate-800/80 border border-slate-700/50'}`}
                    >
                      🛠️ Benches
                    </button>
                  </div>

                  {/* Sub-Tab Content Views */}
                  <div className="space-y-4 pt-1">
                    {managementSubTab === 'users' && (
                      <div className="space-y-4">
                        <div className="p-3.5 rounded-xl bg-slate-900 border border-slate-800 space-y-3">
                          <h3 className="font-bold text-xs uppercase tracking-wider text-purple-400">Create New Login Account</h3>
                          <form onSubmit={handleAddUser} className="flex gap-2 flex-wrap">
                            <input 
                              type="text" 
                              placeholder="Username..." 
                              value={newUsername} 
                              onChange={(e) => setNewUsername(e.target.value)} 
                              className="flex-1 min-w-[140px] p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-semibold text-white focus:outline-none focus:border-purple-500" 
                            />
                            <select 
                              value={newUserRole} 
                              onChange={(e) => setNewUserRole(e.target.value)} 
                              className="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-semibold text-white focus:outline-none focus:border-purple-500"
                            >
                              <option value="supervisor">Supervisor</option>
                              <option value="observer">Observer</option>
                              <option value="admin">Admin</option>
                            </select>
                            <button type="submit" className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md">+ Create</button>
                          </form>
                        </div>

                        <div className="space-y-2">
                          <h3 className="font-bold text-xs text-slate-400 px-1">Existing Accounts ({users.length})</h3>
                          {users.map(u => (
                            <div key={u.username} className="p-3 rounded-xl bg-slate-900/60 border border-slate-800 flex justify-between items-center">
                              <div>
                                <p className="font-bold text-sm text-slate-200">{u.username} <span className="text-[10px] uppercase px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-300 ml-1.5">{u.role}</span></p>
                                <p className="text-[11px] text-slate-400 mt-0.5">{u.passwordSet ? '✓ Password configured' : '⚠️ Pending setup'}</p>
                              </div>
                              {u.username !== 'admin' && (
                                <button onClick={() => setUsers(users.filter(x => x.username !== u.username))} className="px-3 py-1.5 bg-red-600/20 hover:bg-red-600/30 border border-red-500/30 text-red-300 rounded-lg text-xs font-bold transition">Revoke</button>
                              )}
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {managementSubTab === 'employees' && (
                      <div className="space-y-4">
                        <div className="p-3.5 rounded-xl bg-slate-900 border border-slate-800 space-y-3">
                          <h3 className="font-bold text-xs uppercase tracking-wider text-purple-400">Add Employee to Roster</h3>
                          <form onSubmit={handleAddEmployee} className="flex gap-2 flex-wrap">
                            <input 
                              type="text" 
                              placeholder="Name..." 
                              value={newEmpName} 
                              onChange={(e) => setNewEmpName(e.target.value)} 
                              className="flex-1 min-w-[130px] p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-semibold text-white focus:outline-none focus:border-purple-500" 
                            />
                            <input 
                              type="text" 
                              placeholder="Clock #..." 
                              value={newEmpClock} 
                              onChange={(e) => setNewEmpClock(e.target.value)} 
                              className="w-24 p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-semibold text-white focus:outline-none focus:border-purple-500" 
                            />
                            <select 
                              value={newEmpShift} 
                              onChange={(e) => setNewEmpShift(e.target.value)} 
                              className="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-semibold text-white focus:outline-none focus:border-purple-500"
                            >
                              <option value="1">Shift 1</option>
                              <option value="2">Shift 2</option>
                              <option value="3">Shift 3</option>
                            </select>
                            <button type="submit" className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md">+ Add</button>
                          </form>
                        </div>

                        <div className="space-y-2">
                          <h3 className="font-bold text-xs text-slate-400 px-1">Active Roster ({employees.length})</h3>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            {employees.map(emp => (
                              <div key={emp.id} className="p-3 rounded-xl bg-slate-900/60 border border-slate-800 flex justify-between items-center">
                                <div>
                                  <p className="font-bold text-sm text-slate-200">{emp.name}</p>
                                  <p className="text-[11px] text-slate-400 mt-0.5">Clock #{emp.clockNum || 'None'} • Shift {emp.shift}</p>
                                </div>
                                <button onClick={() => setEmployees(employees.filter(e => e.id !== emp.id))} className="w-8 h-8 bg-red-600/20 hover:bg-red-600/30 border border-red-500/30 text-red-300 rounded-lg font-bold flex items-center justify-center transition">×</button>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}

                    {managementSubTab === 'benches' && (
                      <div className="space-y-4">
                        <div className="p-3.5 rounded-xl bg-slate-900 border border-slate-800 space-y-3">
                          <h3 className="font-bold text-xs uppercase tracking-wider text-purple-400">Add Workstation / Bench</h3>
                          <form onSubmit={handleAddBench} className="flex gap-2">
                            <input 
                              type="text" 
                              placeholder="Bench name..." 
                              value={newBenchName} 
                              onChange={(e) => setNewBenchName(e.target.value)} 
                              className="flex-1 p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-semibold text-white focus:outline-none focus:border-purple-500" 
                            />
                            <button type="submit" className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md">+ Add</button>
                          </form>
                        </div>

                        <div className="space-y-2">
                          <h3 className="font-bold text-xs text-slate-400 px-1">Configured Benches ({benches.length})</h3>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            {benches.map(bench => (
                              <div key={bench.id} className="p-3 rounded-xl bg-slate-900/60 border border-slate-800 flex justify-between items-center">
                                <p className="font-bold text-sm text-slate-200">{bench.name}</p>
                                <button onClick={() => setBenches(benches.filter(b => b.id !== bench.id))} className="w-8 h-8 bg-red-600/20 hover:bg-red-600/30 border border-red-500/30 text-red-300 rounded-lg font-bold flex items-center justify-center transition">×</button>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {currentTab === 'settings' && (
                <div className="p-6 rounded-2xl bg-slate-900/50 border border-slate-800 space-y-4">
                  <h2 className="text-base font-bold text-slate-200">Application Settings</h2>
                  <div className="p-4 rounded-xl bg-slate-900 border border-slate-800 flex justify-between items-center">
                    <div>
                      <p className="font-bold text-sm text-slate-200">RotationStation Version</p>
                      <p className="text-xs text-slate-400">Current active build deployed on GitHub Pages</p>
                    </div>
                    <span className="px-3 py-1 rounded-lg bg-purple-500/20 text-purple-300 font-mono text-xs font-bold">v1.5.0</span>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Footer */}
          <footer className="pt-6 mt-6 border-t border-slate-800 text-center text-xs text-slate-500">
            RotationStation • Manufacturing Floor Management System
          </footer>

          {/* Shift Notes Modal Preview */}
          {showNotesModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-md w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                  <h3 className="font-bold text-sm text-slate-200">Shift Notes</h3>
                  <button onClick={() => setShowNotesModal(false)} className="text-slate-400 hover:text-white font-bold text-sm">✕</button>
                </div>
                <textarea 
                  rows="4" 
                  placeholder="Record shift handoff notes or exceptions..." 
                  className="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500 resize-none"
                ></textarea>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShowNotesModal(false)} className="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-bold transition">Save Notes</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<RotationStationApp />, document.getElementById('root'));
  </script>
</body>
</html>
