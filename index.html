<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RotationStation</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCGHbFd-lw_KEwvkjVMRlkHADZL_8aCjQU",
      authDomain: "rotationstation-b820f.firebaseapp.com",
      projectId: "rotationstation-b820f",
      storageBucket: "rotationstation-b820f.firebasestorage.app",
      messagingSenderId: "208135227356",
      appId: "1:208135227356:web:69eac3c59cb2a01a233119"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Helper: Calculate Sunday-to-Saturday Week Key (e.g., "2026-10-04")
    const getWeekKey = (dateStr) => {
      const d = new Date(dateStr + 'T00:00:00');
      const day = d.getDay(); // 0 is Sunday
      const diff = d.getDate() - day;
      const sunday = new Date(d.setDate(diff));
      return `${sunday.getFullYear()}-${(sunday.getMonth() + 1).toString().padStart(2, '0')}-${sunday.getDate().toString().padStart(2, '0')}`;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('schedule');
      const [managementSubTab, setManagementSubTab] = useState('users'); 
      
      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem('rotation_dark_mode') === 'true';
      });

      const [scheduleLocked, setScheduleLocked] = useState(true);
      const [editEmployees, setEditEmployees] = useState(false);
      const [editBenches, setEditBenches] = useState(false);
      
      const [user, setUser] = useState(null);
      const [authStep, setAuthStep] = useState('login'); 
      const [pendingUser, setPendingUser] = useState(null);
      const [usernameInput, setUsernameInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [newPasswordInput, setNewPasswordInput] = useState('');
      const [confirmPasswordInput, setConfirmPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');

      const [employees, setEmployees] = useState([]);
      const [benches, setBenches] = useState([]);
      const [schedules, setSchedules] = useState({});
      const [weeklyNotes, setWeeklyNotes] = useState({});
      const [usersList, setUsersList] = useState([]);
      const [activeSessions, setActiveSessions] = useState({});

      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [activeShift, setActiveShift] = useState("1");
      
      const [newEmployeeName, setNewEmployeeName] = useState('');
      const [newEmployeeClockNum, setNewEmployeeClockNum] = useState('');
      const [newEmployeeShift, setNewEmployeeShift] = useState('1');
      const [newBenchName, setNewBenchName] = useState('');
      
      const [newUsernameInput, setNewUsernameInput] = useState('');
      const [newUserRole, setNewUserRole] = useState('supervisor'); // 'admin' | 'supervisor' | 'observer'
      const [selectedCellData, setSelectedCellData] = useState(null);

      // Exception Modal State
      const [selectedEmployeeForModal, setSelectedEmployeeForModal] = useState(null);

      // Notes Modal & Notification State
      const [isNotesOpen, setIsNotesOpen] = useState(false);
      const [hasUnreadNotes, setHasUnreadNotes] = useState(false);
      const [noteInputText, setNoteInputText] = useState('');

      const currentWeekKey = getWeekKey(selectedDate);
      const currentWeekNotes = weeklyNotes[currentWeekKey]?.notes || [];

      useEffect(() => {
        setEditEmployees(false);
        setEditBenches(false);
      }, [activeTab, managementSubTab]);

      useEffect(() => {
        localStorage.setItem('rotation_dark_mode', darkMode);
      }, [darkMode]);

      // Load session and set up real-time Firestore listeners
      useEffect(() => {
        const savedSession = localStorage.getItem('rotation_session');
        if (savedSession) setUser(JSON.parse(savedSession));

        // Real-time listener for Employees
        const unsubEmployees = db.collection('employees').onSnapshot(snapshot => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setEmployees(list);
        });

        // Real-time listener for Benches
        const unsubBenches = db.collection('benches').onSnapshot(snapshot => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setBenches(list);
        });

        // Real-time listener for Users
        const unsubUsers = db.collection('users').onSnapshot(snapshot => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          if (list.length === 0) {
            const defaultAdmin = { username: 'admin', password: 'password123', role: 'admin', passwordSet: true };
            db.collection('users').doc('admin').set(defaultAdmin);
            setUsersList([defaultAdmin]);
          } else {
            setUsersList(list);
          }
        });

        // Real-time listener for Schedules
        const unsubSchedules = db.collection('schedules').onSnapshot(snapshot => {
          const scheds = {};
          snapshot.forEach(doc => {
            scheds[doc.id] = doc.data();
          });
          setSchedules(scheds);
        });

        // Real-time listener for Weekly Shift Notes
        const unsubNotes = db.collection('weekly_notes').onSnapshot(snapshot => {
          const notesData = {};
          snapshot.forEach(doc => {
            notesData[doc.id] = doc.data();
          });
          setWeeklyNotes(notesData);

          const activeNotes = notesData[currentWeekKey]?.notes || [];
          const lastReadCount = parseInt(localStorage.getItem(`read_notes_${currentWeekKey}`) || '0');
          if (activeNotes.length > lastReadCount) {
            setHasUnreadNotes(true);
          }
        });

        // Real-time listener for Active Sessions
        const unsubSessions = db.collection('sessions').onSnapshot(snapshot => {
          const sessions = {};
          snapshot.forEach(doc => {
            sessions[doc.id] = doc.data();
          });
          setActiveSessions(sessions);
        });

        return () => {
          unsubEmployees();
          unsubBenches();
          unsubUsers();
          unsubSchedules();
          unsubNotes();
          unsubSessions();
        };
      }, [currentWeekKey]);

      // Update active session heartbeat in Firestore
      useEffect(() => {
        if (user) {
          db.collection('sessions').doc(user.username).set({
            role: user.role,
            lastActive: new Date().toLocaleTimeString()
          });
        }
      }, [user]);

      const handleOpenNotes = () => {
        setIsNotesOpen(true);
        setHasUnreadNotes(false);
        localStorage.setItem(`read_notes_${currentWeekKey}`, currentWeekNotes.length.toString());
      };

      const handleAddWeeklyNote = async (e) => {
        e.preventDefault();
        if (!noteInputText.trim() || !user) return;

        const dateObj = new Date();
        const dateStr = dateObj.toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' });
        const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const newEntry = {
          id: Date.now(),
          author: user.username,
          role: user.role,
          timestamp: `${dateStr} @ ${timeStr}`,
          text: noteInputText.trim()
        };

        const updatedNotes = [...currentWeekNotes, newEntry];
        await db.collection('weekly_notes').doc(currentWeekKey).set({
          notes: updatedNotes
        });

        setNoteInputText('');
        localStorage.setItem(`read_notes_${currentWeekKey}`, updatedNotes.length.toString());
      };

      // Clock-number / Seniority-sorted views (lower clock number = higher seniority/first)
      const sortedEmployees = [...employees].sort((a, b) => {
        const clockA = a.clockNum !== undefined && a.clockNum !== '' ? parseInt(a.clockNum, 10) : 999999;
        const clockB = b.clockNum !== undefined && b.clockNum !== '' ? parseInt(b.clockNum, 10) : 999999;
        if (!isNaN(clockA) && !isNaN(clockB) && clockA !== clockB) {
          return clockA - clockB;
        }
        return a.name.localeCompare(b.name);
      });

      const sortedBenches = [...benches].sort((a, b) => a.name.localeCompare(b.name));

      const extendedEmployees = [...sortedEmployees, { id: 'not-running', name: 'Not Running', shift: activeShift, restrictedBenches: [] }];
      
      const getDayData = (date) => {
        if (!schedules[date]) {
          const allBenchIds = benches.map(b => b.id);
          return {
            shiftCount: 2,
            isOT: false,
            shifts: {
              "1": { benchTeams: {}, inactiveBenches: allBenchIds },
              "2": { benchTeams: {}, inactiveBenches: allBenchIds }
            }
          };
        }
        return schedules[date];
      };
      
      const currentDayData = getDayData(selectedDate);
      const isOTActive = currentDayData.isOT || false;
      const currentShiftData = currentDayData.shifts[activeShift] || { benchTeams: {}, inactiveBenches: benches.map(b => b.id) };

      const handleAuth = (e) => {
        e.preventDefault();
        setAuthError('');
        const trimmedUser = usernameInput.trim().toLowerCase();
        if (!trimmedUser || !passwordInput) {
          setAuthError('Please enter both a username and password.');
          return;
        }

        const foundUser = usersList.find(u => u.username.toLowerCase() === trimmedUser);

        if (!foundUser) {
          setAuthError('Username not found. Contact your Admin to create your account.');
          return;
        }

        if (!foundUser.passwordSet) {
          setPendingUser(foundUser);
          setAuthStep('setup_password');
          return;
        }

        if (foundUser.password !== passwordInput) {
          setAuthError('Incorrect password.');
          return;
        }

        setUser(foundUser);
        localStorage.setItem('rotation_session', JSON.stringify(foundUser));
      };

      const handleFirstTimePasswordSetup = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!newPasswordInput || newPasswordInput.length < 4) {
          setAuthError('Password must be at least 4 characters long.');
          return;
        }
        if (newPasswordInput !== confirmPasswordInput) {
          setAuthError('Passwords do not match.');
          return;
        }

        await db.collection('users').doc(pendingUser.username).update({
          password: newPasswordInput,
          passwordSet: true
        });

        const updatedUserSession = { ...pendingUser, password: newPasswordInput, passwordSet: true };
        setUser(updatedUserSession);
        localStorage.setItem('rotation_session', JSON.stringify(updatedUserSession));
      };

      const handleLogout = async () => {
        if (user) {
          await db.collection('sessions').doc(user.username).delete();
        }
        setUser(null);
        localStorage.removeItem('rotation_session');
        setUsernameInput('');
        setPasswordInput('');
        setAuthStep('login');
      };

      const handleCreateUser = async (e) => {
        e.preventDefault();
        if (user?.role !== 'admin' || !newUsernameInput.trim()) return;
        const trimmedNewUser = newUsernameInput.trim();
        const trimmedLower = trimmedNewUser.toLowerCase();

        if (usersList.find(u => u.username.toLowerCase() === trimmedLower)) {
          alert('A user with this username already exists.');
          return;
        }

        const newUserObj = {
          username: trimmedNewUser,
          password: '',
          role: newUserRole,
          passwordSet: false
        };

        await db.collection('users').doc(trimmedNewUser).set(newUserObj);
        setNewUsernameInput('');
      };

      const handleDeleteUser = async (usernameToDelete) => {
        if (user?.role !== 'admin' || usernameToDelete === 'admin') return;
        if (confirm(`Are you sure you want to revoke access for user "${usernameToDelete}"?`)) {
          await db.collection('users').doc(usernameToDelete).delete();
          await db.collection('sessions').doc(usernameToDelete).delete();
        }
      };

      const handleResetUserPassword = async (targetUsername) => {
        if (user?.role !== 'admin') return;
        if (confirm(`Reset password for "${targetUsername}"? They will be forced to set a new password on their next login.`)) {
          await db.collection('users').doc(targetUsername).update({
            password: '',
            passwordSet: false
          });
        }
      };

      const handleAddEmployee = async (e) => {
        e.preventDefault();
        if (user?.role !== 'admin' || !newEmployeeName.trim()) return;
        const empId = Date.now().toString();
        const newEmp = { 
          id: empId, 
          name: newEmployeeName.trim(), 
          clockNum: newEmployeeClockNum.trim(),
          shift: newEmployeeShift, 
          restrictedBenches: [] 
        };
        await db.collection('employees').doc(empId).set(newEmp);
        setNewEmployeeName('');
        setNewEmployeeClockNum('');
      };

      const handleUpdateEmployeeField = async (id, field, value) => {
        if (user?.role !== 'admin') return;
        const updates = {};
        updates[field] = value;
        await db.collection('employees').doc(id).update(updates);
      };

      const handleDeleteEmployee = async (id, empName) => {
        if (user?.role !== 'admin' || id === 'not-running') return;
        if (confirm(`Are you sure you want to delete employee "${empName}" from the roster?`)) {
          await db.collection('employees').doc(id).delete();
        }
      };

      const handleAddBench = async (e) => {
        e.preventDefault();
        if (user?.role !== 'admin' || !newBenchName.trim()) return;
        const benchId = Date.now().toString();
        const newBench = { id: benchId, name: newBenchName.trim() };
        await db.collection('benches').doc(benchId).set(newBench);
        setNewBenchName('');
      };

      const handleDeleteBench = async (id, benchName) => {
        if (user?.role !== 'admin') return;
        if (confirm(`Are you sure you want to delete workstation "${benchName}"?`)) {
          await db.collection('benches').doc(id).delete();
        }
      };

      const saveScheduleToFirestore = async (newData) => {
        await db.collection('schedules').doc(selectedDate).set(newData);
      };

      const handleShiftCountChange = (count) => {
        if (user?.role === 'observer') return;
        const newData = { ...currentDayData, shiftCount: count };
        for (let i = 1; i <= count; i++) {
          if (!newData.shifts[i.toString()]) {
            const allBenchIds = benches.map(b => b.id);
            newData.shifts[i.toString()] = { benchTeams: {}, inactiveBenches: allBenchIds };
          }
        }
        if (parseInt(activeShift) > count) setActiveShift("1");
        saveScheduleToFirestore(newData);
      };

      const handleToggleOT = () => {
        if (user?.role === 'observer' || scheduleLocked) return;
        const newData = { ...currentDayData, isOT: !isOTActive };
        saveScheduleToFirestore(newData);
      };

      const handleToggleAbsence = (empId) => {
        if (user?.role === 'observer') return;
        const newData = { ...currentDayData };
        const shiftData = { ...currentShiftData };
        let absList = shiftData.absentEmployees || [];
        if (absList.includes(empId)) {
          absList = absList.filter(id => id !== empId);
        } else {
          absList.push(empId);
          Object.keys(shiftData.benchTeams || {}).forEach(bId => {
            shiftData.benchTeams[bId] = (shiftData.benchTeams[bId] || []).filter(id => id !== empId);
          });
        }
        shiftData.absentEmployees = absList;
        newData.shifts[activeShift] = shiftData;
        saveScheduleToFirestore(newData);
      };

      const handleToggleBenchInactive = (benchId) => {
        if (user?.role === 'observer') return;
        const newData = { ...currentDayData };
        const shiftData = { ...currentShiftData };
        let inactive = shiftData.inactiveBenches || [];
        if (inactive.includes(benchId)) {
          inactive = inactive.filter(id => id !== benchId);
        } else {
          inactive.push(benchId);
          const teams = { ...(shiftData.benchTeams || {}) };
          delete teams[benchId];
          shiftData.benchTeams = teams;
        }
        shiftData.inactiveBenches = inactive;
        newData.shifts[activeShift] = shiftData;
        saveScheduleToFirestore(newData);
      };

      const handleAssignEmployee = (benchId, employeeId) => {
        if (user?.role === 'observer' || !employeeId) return;
        const newData = { ...currentDayData };
        const shiftData = { ...currentShiftData };
        const benchTeams = { ...(shiftData.benchTeams || {}) };
        let benchTeam = benchTeams[benchId] || [];
        if (!Array.isArray(benchTeam)) benchTeam = [benchTeam];

        if (!benchTeam.includes(employeeId)) {
          benchTeams[benchId] = [...benchTeam, employeeId];
          shiftData.benchTeams = benchTeams;
          newData.shifts[activeShift] = shiftData;
          saveScheduleToFirestore(newData);
        }
      };

      const handleRemoveEmployee = (benchId, employeeId) => {
        if (user?.role === 'observer') return;
        const newData = { ...currentDayData };
        const shiftData = { ...currentShiftData };
        const benchTeams = { ...(shiftData.benchTeams || {}) };
        let benchTeam = benchTeams[benchId] || [];
        if (!Array.isArray(benchTeam)) benchTeam = [benchTeam];

        benchTeams[benchId] = benchTeam.filter(id => id !== employeeId);
        shiftData.benchTeams = benchTeams;
        newData.shifts[activeShift] = shiftData;
        saveScheduleToFirestore(newData);
      };

      const calculateAnalytics = () => {
        const stats = {};
        const datesTracked = {}; 

        extendedEmployees.forEach(emp => {
          stats[emp.id] = {};
          datesTracked[emp.id] = {};
          sortedBenches.forEach(bench => {
            stats[emp.id][bench.id] = 0;
            datesTracked[emp.id][bench.id] = [];
          });
        });

        Object.keys(schedules).forEach(dateStr => {
          const dayData = schedules[dateStr];
          if (!dayData || !dayData.shifts) return;

          Object.keys(dayData.shifts).forEach(shiftNum => {
            if (parseInt(shiftNum) > dayData.shiftCount) return;
            const shiftAssignments = dayData.shifts[shiftNum]?.benchTeams || {};

            Object.keys(shiftAssignments).forEach(benchId => {
              let team = shiftAssignments[benchId] || [];
              if (!Array.isArray(team)) team = [team];

              team.forEach(empId => {
                if (stats[empId]?.[benchId] !== undefined) {
                  stats[empId][benchId]++;
                  datesTracked[empId][benchId].push(`${dateStr} (Shift ${shiftNum})`);
                }
              });
            });
          });
        });

        return { stats, datesTracked };
      };

      const { stats, datesTracked } = calculateAnalytics();

      const getHeatmapColor = (count) => {
        if (count === 0) return darkMode ? 'bg-slate-800 text-slate-500' : 'bg-slate-100 text-slate-700 border border-slate-200';
        return 'bg-emerald-600 text-white font-bold';
      };

      if (!user) {
        return (
          <div className={`min-h-screen flex items-center justify-center p-4 ${darkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-100 text-slate-900'}`}>
            <div className={`w-full max-w-md border rounded-xl shadow-lg p-8 ${darkMode ? 'bg-slate-800 border-slate-700 text-slate-100' : 'bg-white border-slate-200 text-slate-900'}`}>
              <div className="flex justify-between items-center mb-6">
                <h1 className="text-2xl font-bold tracking-tight">RotationStation</h1>
              </div>

              {authStep === 'login' && (
                <>
                  <p className={`text-sm mb-6 ${darkMode ? 'text-slate-400' : 'text-slate-700'}`}>
                    Sign in with your assigned username. If it is your first time logging in, you will be prompted to create your password.
                  </p>
                  {authError && <div className="mb-4 p-3 bg-red-100 border border-red-400 text-red-800 text-sm rounded-lg font-semibold">{authError}</div>}
                  <form onSubmit={handleAuth} className="space-y-4">
                    <div>
                      <label className={`block text-sm font-semibold mb-1.5 ${darkMode ? 'text-slate-200' : 'text-slate-900'}`}>Username</label>
                      <input type="text" value={usernameInput} onChange={(e) => setUsernameInput(e.target.value)} className={`w-full p-3 border rounded-lg outline-none transition font-medium ${darkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900 focus:bg-white focus:border-blue-500'}`} placeholder="e.g. admin" />
                    </div>
                    <div>
                      <label className={`block text-sm font-semibold mb-1.5 ${darkMode ? 'text-slate-200' : 'text-slate-900'}`}>Password</label>
                      <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className={`w-full p-3 border rounded-lg outline-none transition font-medium ${darkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900 focus:bg-white focus:border-blue-500'}`} placeholder="••••••••" />
                    </div>
                    <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 font-semibold rounded-lg text-white shadow transition">Sign In</button>
                  </form>
                </>
              )}

              {authStep === 'setup_password' && (
                <>
                  <div className="mb-4 p-3 bg-blue-50 border border-blue-200 text-blue-900 text-sm rounded-lg font-medium">
                    Welcome <strong>{pendingUser.username}</strong>! This is your first time logging in. Please choose a personal password.
                  </div>
                  {authError && <div className="mb-4 p-3 bg-red-100 border border-red-400 text-red-800 text-sm rounded-lg font-semibold">{authError}</div>}
                  <form onSubmit={handleFirstTimePasswordSetup} className="space-y-4">
                    <div>
                      <label className={`block text-sm font-semibold mb-1.5 ${darkMode ? 'text-slate-200' : 'text-slate-900'}`}>New Password</label>
                      <input type="password" value={newPasswordInput} onChange={(e) => setNewPasswordInput(e.target.value)} className={`w-full p-3 border rounded-lg outline-none transition font-medium ${darkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900 focus:bg-white focus:border-blue-500'}`} placeholder="At least 4 characters" />
                    </div>
                    <div>
                      <label className={`block text-sm font-semibold mb-1.5 ${darkMode ? 'text-slate-200' : 'text-slate-900'}`}>Confirm Password</label>
                      <input type="password" value={confirmPasswordInput} onChange={(e) => setConfirmPasswordInput(e.target.value)} className={`w-full p-3 border rounded-lg outline-none transition font-medium ${darkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900 focus:bg-white focus:border-blue-500'}`} placeholder="Confirm password" />
                    </div>
                    <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 font-semibold rounded-lg text-white shadow transition">Save Password & Continue</button>
                  </form>
                </>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen ${darkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-100 text-slate-900'}`}>
          <div className={`p-4 border-b ${darkMode ? 'bg-slate-800 border-slate-700 text-slate-100' : 'bg-white border-slate-200 shadow-sm text-slate-900'}`}>
            <div className="max-w-6xl mx-auto flex justify-between items-center flex-wrap gap-4">
              <div className="flex items-center gap-3">
                <h1 className="text-xl font-bold tracking-tight">RotationStation</h1>
                <span className={`text-xs px-2.5 py-1 rounded-full uppercase tracking-wider font-bold ${user.role === 'admin' ? 'bg-purple-100 text-purple-900 dark:bg-purple-900 dark:text-purple-200' : user.role === 'supervisor' ? 'bg-blue-100 text-blue-900 dark:bg-blue-900 dark:text-blue-200' : 'bg-amber-100 text-amber-900 dark:bg-amber-900 dark:text-amber-200'}`}>
                  {user.username}
                </span>
              </div>
              <div className="flex space-x-2 items-center overflow-x-auto max-w-full pb-1">
                <button 
                  onClick={handleOpenNotes} 
                  className="relative px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg text-sm transition shadow-sm flex items-center gap-1.5 shrink-0"
                >
                  📝 Shift Notes
                  {hasUnreadNotes && (
                    <span className="relative flex h-3 w-3">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>

                      <p className={`text-xs font-semibold mb-4 ${darkMode ? 'text-slate-400' : 'text-slate-700'}`}>Physical factory benches or lines used for shift assignments.</p>
                      <form onSubmit={handleAddBench} className="flex gap-2">
                        <input type="text" placeholder="Bench name (e.g. Assembly Line B)..." value={newBenchName} onChange={(e) => setNewBenchName(e.target.value)} className={`flex-1 p-2.5 border rounded-lg text-sm font-semibold ${darkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-400 text-slate-900'}`} />
                        <button type="submit" className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold transition shadow-xs">+ Add Bench</button>
                      </form>
                    </div>

                    <div>
                      <div className="flex justify-between items-center mb-3">
                        <h3 className={`font-bold text-base ${darkMode ? 'text-white' : 'text-slate-900'}`}>Configured Benches ({benches.length})</h3>
                        <button onClick={() => setEditBenches(!editBenches)} className={`text-xs px-3 py-1.5 rounded-lg font-bold transition shadow-xs ${editBenches ? 'bg-amber-600 text-white' : darkMode ? 'bg-slate-700 text-slate-200 hover:bg-slate-600' : 'bg-slate-200 text-slate-900 hover:bg-slate-300 border border-slate-300'}`}>
                          {editBenches ? '🔒 Lock Deletions' : '✏️ Enable Delete Mode'}
                        </button>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                        {sortedBenches.map(bench => (
                          <div key={bench.id} className={`p-3.5 rounded-xl border flex justify-between items-center ${darkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-slate-300 text-slate-900 shadow-xs'}`}>
                            <p className={`font-bold text-sm ${darkMode ? 'text-white' : 'text-slate-900'}`}>{bench.name}</p>
                            {editBenches && (
                              <button onClick={() => handleDeleteBench(bench.id, bench.name)} className="w-8 h-8 rounded-lg bg-red-600 text-white font-extrabold flex items-center justify-center hover:bg-red-700 transition shadow-xs">×</button>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'settings' && (
              <div className={`p-6 rounded-xl border shadow-sm space-y-6 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                <div>
                  <h2 className={`text-xl font-bold mb-4 ${darkMode ? 'text-white' : 'text-slate-900'}`}>Account Information</h2>
                  <div className={`p-4 rounded-xl border ${darkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`}>
                    <p className={`text-sm font-bold ${darkMode ? 'text-slate-300' : 'text-slate-900'}`}>Signed in username: <strong className="text-blue-600 dark:text-blue-400">{user.username}</strong></p>
                    <p className={`text-sm font-bold capitalize mt-1 ${darkMode ? 'text-slate-300' : 'text-slate-900'}`}>Role: <strong className={darkMode ? 'text-slate-100' : 'text-slate-900'}>{user.role}</strong></p>
                  </div>
                </div>

                <div>
                  <h2 className={`text-xl font-bold mb-4 ${darkMode ? 'text-white' : 'text-slate-900'}`}>Appearance</h2>
                  <div className={`p-4 rounded-xl border flex items-center justify-between ${darkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`}>
                    <div>
                      <p className={`font-bold text-sm ${darkMode ? 'text-white' : 'text-slate-900'}`}>Theme Preference</p>
                      <p className={`text-xs font-semibold ${darkMode ? 'text-slate-400' : 'text-slate-700'}`}>Switch between light and dark visual mode.</p>
                    </div>
                    <button onClick={() => setDarkMode(!darkMode)} className="px-4 py-2 bg-slate-200 text-slate-900 dark:bg-slate-700 dark:text-white hover:bg-slate-300 dark:hover:bg-slate-600 font-bold text-sm rounded-lg transition shadow-xs">
                      {darkMode ? '🌙 Dark Mode (Active)' : '☀️ Light Mode (Active)'}
                    </button>
                  </div>
                </div>

                <div className="pt-4 border-t border-slate-200 dark:border-slate-700 flex justify-between items-center">
                  <span className="text-xs text-slate-400">RotationStation v1.4</span>
                  <button onClick={handleLogout} className="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow transition">
                    Log Out of Account
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* Employee Exceptions Modal */}
          {selectedEmployeeForModal && user.role === 'admin' && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className={`w-full max-w-md p-6 rounded-2xl shadow-xl border space-y-4 ${darkMode ? 'bg-slate-800 text-white border-slate-700' : 'bg-white text-slate-900 border-slate-300'}`}>
                <h3 className="text-lg font-bold">Exceptions: {selectedEmployeeForModal.name}</h3>
                <p className="text-xs text-slate-500">Check benches this employee is <strong>restricted</strong> from running (whitelisted everywhere else by default):</p>
                <div className="space-y-2 max-h-60 overflow-y-auto border p-3 rounded-xl">
                  {benches.map(bench => {
                    const restricted = selectedEmployeeForModal.restrictedBenches || [];
                    const isChecked = restricted.includes(bench.name);
                    return (
                      <label key={bench.id} className="flex items-center gap-3 cursor-pointer">
                        <input 
                          type="checkbox" 
                          checked={isChecked}
                          onChange={async (e) => {
                            const updated = e.target.checked 
                              ? [...restricted, bench.name]
                              : restricted.filter(b => b !== bench.name);
                            
                            await db.collection('employees').doc(selectedEmployeeForModal.id).update({
                              restrictedBenches: updated
                            });
                            setSelectedEmployeeForModal({
                              ...selectedEmployeeForModal,
                              restrictedBenches: updated
                            });
                          }}
                          className="w-4 h-4 rounded"
                        />
                        <span className="text-sm font-semibold">{bench.name}</span>
                      </label>
                    );
                  })}
                </div>
                <button onClick={() => setSelectedEmployeeForModal(null)} className="w-full py-2.5 bg-slate-800 text-white rounded-xl font-bold">Done</button>
              </div>
            </div>
          )}

          {/* Weekly Shift Notes Pop-Open Modal */}
          {isNotesOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className={`w-full max-w-lg rounded-2xl shadow-xl border p-6 flex flex-col max-h-[85vh] ${darkMode ? 'bg-slate-800 text-white border-slate-700' : 'bg-white text-slate-900 border-slate-300'}`}>
                <div className="flex justify-between items-center pb-4 border-b border-slate-200 dark:border-slate-700 mb-4">
                  <div>
                    <h3 className="text-lg font-bold">Weekly Shift Handover Log</h3>
                    <p className="text-xs font-semibold text-slate-500 dark:text-slate-400">Week of {currentWeekKey} (Sun - Sat)</p>
                  </div>
                  <button onClick={() => setIsNotesOpen(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">×</button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 mb-4 pr-1">
                  {currentWeekNotes.length === 0 ? (
                    <p className="text-sm italic text-slate-500 text-center py-8">No notes posted for this week yet.</p>
                  ) : (
                    currentWeekNotes.map(note => (
                      <div key={note.id} className={`p-3 border rounded-xl space-y-1 ${darkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                        <div className="flex justify-between items-center text-xs">
                          <span className="font-bold text-blue-600 dark:text-blue-400">
                            [{note.author} <span className="uppercase text-[10px] px-1.5 py-0.5 rounded bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">{note.role}</span>]
                          </span>
                          <span className="text-slate-400 font-medium">{note.timestamp}</span>
                        </div>
                        <p className="text-sm font-medium">{note.text}</p>
                      </div>
                    ))
                  )}
                </div>

                <form onSubmit={handleAddWeeklyNote} className="space-y-3 pt-3 border-t border-slate-200 dark:border-slate-700">
                  <textarea 
                    value={noteInputText} 
                    onChange={(e) => setNoteInputText(e.target.value)} 
                    placeholder={`Post weekly note as [${user.username}]...`} 
                    className={`w-full p-3 border rounded-xl text-sm outline-none font-medium ${darkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}`}
                    rows={2}
                  />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setIsNotesOpen(false)} className="px-4 py-2 bg-slate-200 dark:bg-slate-700 font-bold text-sm rounded-lg">Close</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 font-bold text-sm text-white rounded-lg shadow-xs">+ Post Note Entry</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {selectedCellData && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className={`w-full max-w-md p-6 rounded-2xl shadow-xl border ${darkMode ? 'bg-slate-800 text-white border-slate-700' : 'bg-white text-slate-900 border-slate-300'}`}>
                <h3 className={`text-lg font-bold mb-1 ${darkMode ? 'text-white' : 'text-slate-900'}`}>{selectedCellData.emp.name} @ {selectedCellData.bench.name}</h3>
                <p className={`text-sm font-semibold mb-4 ${darkMode ? 'text-slate-400' : 'text-slate-700'}`}>Total shifts: <span className="font-bold text-blue-600 dark:text-blue-400">{selectedCellData.count}</span></p>
                <div className={`max-h-60 overflow-y-auto space-y-2 border-t border-b py-3 ${darkMode ? 'border-slate-700' : 'border-slate-200'}`}>
                  {selectedCellData.dates.length === 0 ? <p className={`text-sm italic font-medium ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>No shifts recorded yet.</p> : selectedCellData.dates.map((d, i) => <div key={i} className={`text-sm font-semibold ${darkMode ? 'text-slate-300' : 'text-slate-800'}`}>📅 {d}</div>)}
                </div>
                <button onClick={() => setSelectedCellData(null)} className="w-full mt-5 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition">Close</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
